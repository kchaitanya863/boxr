name: CI & Automated Release

# ==============================================================================
# RUNNER CONFIGURATION TOGGLE
# Easily switch between GitHub-hosted runners and self-hosted runners.
#
# Option A: GitHub-Hosted Runners (ACTIVE)
.runners:
  linux: &runner_linux ubuntu-24.04
  macos: &runner_macos macos-15
  linux_arm: &runner_linux_arm ubuntu-24.04-arm

# Option B: Self-Hosted Runners (Uncomment to toggle to self-hosted runners)
# .runners:
#   linux: &runner_linux [self-hosted, Linux]
#   macos: &runner_macos [self-hosted, macOS]
#   linux_arm: &runner_linux_arm [self-hosted, Linux, ARM64]
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: 'Toggle to use self-hosted runners'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  USE_SELF_HOSTED: false # Set to true when switching to self-hosted runner pool

jobs:
  test:
    # Check name kept for branch ruleset compatibility.
    name: Test & Lint (macOS Self-Hosted)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: *runner_linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure PATH
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -A clippy::all

      - name: Install Linux rootless runtime deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-mingw-w64-x86-64 uidmap passt iproute2 bats apache2-utils jq socat skopeo python3-pytest python3-requests python3-docker
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check Windows target (x86_64-pc-windows-gnu)
        run: cargo check --target x86_64-pc-windows-gnu

      - name: Build boxr binary
        run: cargo build

      - name: Podman BATS offline gate (015-help, 020-tag strict)
        env:
          BOXR_TEST_EMBEDDED_USERNET: "1"
        run: |
          chmod +x scripts/run_podman_bats_offline_gate.sh scripts/run_podman_bats_conformance.sh
          ./scripts/run_podman_bats_offline_gate.sh

      - name: Podman Compose, APIv2, and Python Docker conformance smoke
        env:
          BOXR_TEST_EMBEDDED_USERNET: "1"
        run: |
          chmod +x scripts/run_podman_compose_conformance.sh scripts/run_podman_apiv2_conformance.sh scripts/run_podman_python_conformance.sh
          ./scripts/run_podman_compose_conformance.sh simple_port_map
          SKIP_APIV2_PYTHON=1 ./scripts/run_podman_apiv2_conformance.sh 01
          ./scripts/run_podman_python_conformance.sh test_system.py

      - name: Podman BATS conformance (curated manifest, strict)
        timeout-minutes: 45
        continue-on-error: true
        env:
          PODMAN_BATS_OMIT_HOST_GATED: "1"
          PODMAN_BATS_STRICT: "1"
          BOXR_TEST_EMBEDDED_USERNET: "1"
        run: |
          chmod +x scripts/run_podman_bats_conformance.sh scripts/sync_podman_bats_upstream.sh
          cat > /tmp/ci-curated-smoke.txt <<'EOF'
          001-basic
          005-info
          010-images
          040-ps
          080-pause
          085-top
          110-history
          125-import
          130-kill
          140-diff
          750-trust
          EOF
          MANIFEST=/tmp/ci-curated-smoke.txt ./scripts/run_podman_bats_conformance.sh || true
          log=$(ls -t .cache/podman-bats-results/run-*.log | head -1)
          echo "## Curated Podman BATS (strict)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ok |^not ok ' "$log" | awk '{if($1=="ok") o++; else n++} END {print "- ok:", o+0, "not ok:", n+0}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podman-bats-curated-log
          path: .cache/podman-bats-results/run-*.log

      - name: Podman black-box E2E (audit + shell QA)
        run: BOXR_TEST_EMBEDDED_USERNET=1 ./scripts/run_podman_blackbox_e2e.sh --no-rust ./target/debug/boxr

      - name: Run Test Suite
        run: cargo test --all -- --test-threads=1

      - name: Run Black-Box QA (shell smoke)
        run: ./scripts/run_blackbox_qa.sh -b ./target/debug/boxr --no-rust -s negative

  podman-bats-full-catalog:
    name: Podman BATS (full upstream catalog, shard ${{ matrix.shard }}/4)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: *runner_linux
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq uidmap passt iproute2 bats apache2-utils jq socat skopeo
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build
        run: cargo build
      - name: Run all vendored upstream BATS (progress tracker)
        env:
          PODMAN_BATS_OMIT_HOST_GATED: "1"
          PODMAN_BATS_STRICT: "1"
          BOXR_TEST_EMBEDDED_USERNET: "1"
          BATS_SHARD_INDEX: "${{ matrix.shard }}"
          BATS_SHARD_TOTAL: "4"
        run: |
          chmod +x scripts/run_podman_bats_all_upstream.sh scripts/run_podman_bats_conformance.sh
          ./scripts/run_podman_bats_all_upstream.sh || true
          log=$(ls -t .cache/podman-bats-results/run-*.log | head -1)
          echo "## Full upstream BATS summary (shard ${{ matrix.shard }}/4)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ok |^not ok ' "$log" | awk '{if($1=="ok") o++; else n++} END {print "- ok:", o+0, "not ok:", n+0}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podman-bats-full-log-shard-${{ matrix.shard }}
          path: .cache/podman-bats-results/run-*.log

  bump-and-tag:
    name: Bump Version & Create Git Tag
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: *runner_linux
    defaults:
      run:
        shell: bash
    outputs:
      new_tag: ${{ steps.version.outputs.tag }}
      new_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Verify RELEASE_TOKEN secret
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN secret is missing or expired. The automated version bump cannot push to main without it."
            echo "::error::Rotation runbook: docs/RELEASING.md"
            exit 1
          fi
          echo "RELEASE_TOKEN is present."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Configure PATH
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Compute Next Version
        id: version
        run: |
          CURRENT_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "Current Cargo version: $CURRENT_VER"

          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VER="$CURRENT_VER"
          else
            BASE_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$BASE_VER" | cut -d. -f1)
            MINOR=$(echo "$BASE_VER" | cut -d. -f2)
            PATCH=$(echo "$BASE_VER" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          NEW_TAG="v${NEW_VER}"
          echo "Next Release Tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

          perl -pi -e 's/^version = ".*"/version = "'"$NEW_VER"'"/' Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to $NEW_TAG [skip ci]" || true
          git push origin main
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
      - name: Diagnose release push failure
        if: failure()
        run: |
          echo "::error::Version-bump push to main failed. Most likely cause: RELEASE_TOKEN expired, revoked, or missing."
          echo "::error::Rotation runbook: docs/RELEASING.md"


  release:
    name: Build & Publish Release (${{ matrix.name }})
    needs: [test, bump-and-tag]
    if: always() && needs.test.result == 'success' && (needs.bump-and-tag.result == 'success' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon arm64)
            os: *runner_macos
            target: aarch64-apple-darwin
            artifact_name: boxr-macos-arm64.tar.gz
            use_zig: false
            build_pkg: false
            is_windows: false
          - name: macOS (Intel x86_64)
            os: *runner_macos
            target: x86_64-apple-darwin
            artifact_name: boxr-macos-x86_64.tar.gz
            use_zig: false
            build_pkg: false
            is_windows: false
          - name: Linux (musl arm64)
            os: *runner_linux_arm
            target: aarch64-unknown-linux-musl
            artifact_name: boxr-linux-arm64.tar.gz
            use_zig: true
            build_pkg: true
            deb_arch: arm64
            rpm_arch: aarch64
            is_windows: false
          - name: Linux (musl x86_64)
            os: *runner_linux
            target: x86_64-unknown-linux-musl
            artifact_name: boxr-linux-x86_64.tar.gz
            use_zig: true
            build_pkg: true
            deb_arch: amd64
            rpm_arch: x86_64
            is_windows: false
          - name: Windows (x86_64)
            os: *runner_macos
            target: x86_64-pc-windows-gnu
            artifact_name: boxr-windows-x86_64.zip
            use_zig: true
            build_pkg: false
            is_windows: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag || github.ref_name }}
          submodules: false

      - name: Configure PATH
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Ensure Cross-Compilation Dependencies
        run: |
          OS="$(uname -s)"
          if ! command -v zig >/dev/null 2>&1; then
            if [ "$OS" = "Darwin" ]; then
              brew install zig
            else
              python3 -m pip install --quiet --break-system-packages ziglang
              echo "$HOME/.local/bin" >> $GITHUB_PATH
              export PATH="$HOME/.local/bin:$PATH"
            fi
          fi
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            if [ "$OS" = "Darwin" ]; then
              cargo install cargo-zigbuild || brew install cargo-zigbuild
            else
              python3 -m pip install --quiet --break-system-packages cargo-zigbuild || cargo install cargo-zigbuild
            fi
          fi
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            if [ "$OS" = "Darwin" ]; then
              brew install dpkg
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq dpkg-dev
            fi
          fi
          if ! command -v rpmbuild >/dev/null 2>&1; then
            if [ "$OS" = "Darwin" ]; then
              brew install rpm
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq rpm
            fi
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Pre-generate Shell Completions
        run: |
          mkdir -p completions
          cargo run --quiet -- completion bash > completions/boxr.bash
          cargo run --quiet -- completion zsh > completions/_boxr
          cargo run --quiet -- completion fish > completions/boxr.fish

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Release Artifact (Unix)
        if: "!matrix.is_windows"
        run: |
          mkdir -p package/bin package/completions
          cp target/${{ matrix.target }}/release/boxr package/bin/
          cp install.sh package/
          cp install.ps1 package/ 2>/dev/null || true
          cp README.md package/
          cp LICENSE package/ 2>/dev/null || true
          cp completions/boxr.bash package/completions/
          cp completions/_boxr package/completions/
          cp completions/boxr.fish package/completions/

          COPYFILE_DISABLE=1 tar --no-xattrs -czvf ${{ matrix.artifact_name }} -C package .
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Release Artifact (Windows)
        if: matrix.is_windows
        run: |
          mkdir -p package-win/bin package-win/completions
          cp target/${{ matrix.target }}/release/boxr.exe package-win/bin/
          cp install.ps1 package-win/ 2>/dev/null || true
          cp install.sh package-win/ 2>/dev/null || true
          cp README.md package-win/
          cp LICENSE package-win/ 2>/dev/null || true
          cp completions/boxr.bash package-win/completions/
          cp completions/_boxr package-win/completions/
          cp completions/boxr.fish package-win/completions/

          (cd package-win && zip -r ../${{ matrix.artifact_name }} .)
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Build Debian Package (.deb)
        if: matrix.build_pkg
        run: |
          TAG="${{ needs.bump-and-tag.outputs.new_tag || github.ref_name }}"
          VER="${TAG#v}"
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh "target/${{ matrix.target }}/release/boxr" "$VER" "${{ matrix.deb_arch }}" .
          shasum -a 256 boxr_${VER}_${{ matrix.deb_arch }}.deb > boxr_${VER}_${{ matrix.deb_arch }}.deb.sha256

      - name: Build RPM Package (.rpm)
        if: matrix.build_pkg
        run: |
          TAG="${{ needs.bump-and-tag.outputs.new_tag || github.ref_name }}"
          VER="${TAG#v}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/${{ matrix.target }}/release/boxr rpmbuild/SOURCES/
          cp completions/* rpmbuild/SOURCES/
          rpmbuild --define "_topdir $(pwd)/rpmbuild" --define "version $VER" --define "_prefix /usr" --define "_bindir /usr/bin" --define "_datadir /usr/share" --target ${{ matrix.rpm_arch }} -bb packaging/rpm/boxr.spec
          cp rpmbuild/RPMS/*/*.rpm .
          shasum -a 256 *.rpm > boxr-${VER}-1.${{ matrix.rpm_arch }}.rpm.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.new_tag || github.ref_name }}
          name: Release ${{ needs.bump-and-tag.outputs.new_tag || github.ref_name }}
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  update-brew-tap:
    name: Publish Release & Update Homebrew Tap
    needs: [bump-and-tag, release]
    if: always() && needs.release.result == 'success'
    runs-on: *runner_linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Homebrew Tap repository
        uses: actions/checkout@v4
        with:
          repository: kchaitanya863/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          path: homebrew-tap
          submodules: false

      - name: Configure PATH
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download Release Assets
        id: dl
        run: |
          if [ -n "${{ needs.bump-and-tag.outputs.new_tag }}" ]; then
            TAG="${{ needs.bump-and-tag.outputs.new_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p assets
          gh release download "$TAG" --repo ${{ github.repository }} --dir assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Assets to Homebrew Tap Release
        run: |
          TAG="${{ steps.dl.outputs.tag }}"
          cd assets
          gh release create "$TAG" --repo kchaitanya863/homebrew-tap --title "Release $TAG" --notes "Release $TAG of Boxr container engine" boxr* || \
          gh release upload "$TAG" --repo kchaitanya863/homebrew-tap boxr* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Formula/boxr.rb
        run: |
          TAG="${{ steps.dl.outputs.tag }}"

          MACOS_ARM_SHA=$(cat assets/boxr-macos-arm64.tar.gz.sha256 2>/dev/null | awk '{print $1}' || echo "")
          MACOS_X86_SHA=$(cat assets/boxr-macos-x86_64.tar.gz.sha256 2>/dev/null | awk '{print $1}' || echo "$MACOS_ARM_SHA")
          LINUX_ARM_SHA=$(cat assets/boxr-linux-arm64.tar.gz.sha256 2>/dev/null | awk '{print $1}' || echo "")
          LINUX_X86_SHA=$(cat assets/boxr-linux-x86_64.tar.gz.sha256 2>/dev/null | awk '{print $1}' || echo "$LINUX_ARM_SHA")

          cat << 'EOF' > homebrew-tap/Formula/boxr.rb
          class Boxr < Formula
            desc "Fast, lightweight OCI container engine and runtime written in Rust"
            homepage "https://github.com/kchaitanya863/homebrew-tap"
            license "MIT"
            head "https://github.com/kchaitanya863/boxr.git", branch: "main"

            on_macos do
              on_arm do
                url "https://github.com/kchaitanya863/homebrew-tap/releases/download/__TAG__/boxr-macos-arm64.tar.gz"
                sha256 "__MACOS_ARM_SHA__"
              end
              on_intel do
                url "https://github.com/kchaitanya863/homebrew-tap/releases/download/__TAG__/boxr-macos-x86_64.tar.gz"
                sha256 "__MACOS_X86_SHA__"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/kchaitanya863/homebrew-tap/releases/download/__TAG__/boxr-linux-arm64.tar.gz"
                sha256 "__LINUX_ARM_SHA__"
              end
              on_intel do
                url "https://github.com/kchaitanya863/homebrew-tap/releases/download/__TAG__/boxr-linux-x86_64.tar.gz"
                sha256 "__LINUX_X86_SHA__"
              end
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "bin/boxr"
              end

              # Shell completions
              bash_completion.install "completions/boxr.bash" => "boxr" if File.exist?("completions/boxr.bash")
              zsh_completion.install "completions/_boxr" => "_boxr" if File.exist?("completions/_boxr")
              fish_completion.install "completions/boxr.fish" => "boxr.fish" if File.exist?("completions/boxr.fish")
            end

            service do
              run [opt_bin/"boxr", "daemon"]
              keep_alive true
              log_path var/"log/boxr.log"
              error_log_path var/"log/boxr.log"
              working_dir var
            end

            def caveats
              <<~EOS
                (Optional) Docker Drop-in Alias:
                If you want 'docker' commands to transparently invoke boxr:
                  boxr alias --install
                or add to your shell profile (~/.zshrc or ~/.bashrc):
                  alias docker="boxr"
              EOS
            end

            test do
              assert_match "boxr", shell_output("#{bin}/boxr --version")
              assert_match "Containers:", shell_output("#{bin}/boxr info")
            end
          end
          EOF

          perl -pi -e "s/__TAG__/${TAG}/g" homebrew-tap/Formula/boxr.rb
          perl -pi -e "s/__MACOS_ARM_SHA__/${MACOS_ARM_SHA}/g" homebrew-tap/Formula/boxr.rb
          perl -pi -e "s/__MACOS_X86_SHA__/${MACOS_X86_SHA}/g" homebrew-tap/Formula/boxr.rb
          perl -pi -e "s/__LINUX_ARM_SHA__/${LINUX_ARM_SHA}/g" homebrew-tap/Formula/boxr.rb
          perl -pi -e "s/__LINUX_X86_SHA__/${LINUX_X86_SHA}/g" homebrew-tap/Formula/boxr.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump formula to ${TAG}" || true
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
