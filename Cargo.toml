[package]
name = "boxr"
version = "0.1.53"
edition = "2024"
description = "A fast, lightweight OCI container engine and runtime written in Rust"
authors = ["Boxr Contributors"]
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1.0"
indicatif = "0.17"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.16"
futures-util = "0.3"
serde_yaml = "0.9.34"
axum = "0.8.9"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "sched", "user", "signal", "process", "fs"] }
seccompiler = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

